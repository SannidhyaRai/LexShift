# LexShift shared configuration: the one place for paths, stub switches and weights.
# One section per owner so merges stay clean. Values marked "placeholder" are untuned starting points,
# never results: weights are tuned on DEV queries only (eval/run_ablation.py --tune) and reported on TEST.

paths:                              # relative to the repository root
  raw: data/raw                     # AWS download, git-ignored
  processed: data/processed
  judgments: data/processed/judgments.jsonl        # M1
  doc_statutes: data/processed/doc_statutes.jsonl  # M2
  citations: data/processed/citations.jsonl        # M3
  doc_health: data/processed/doc_health.jsonl      # M3
  doc_meta: data/processed/doc_meta.jsonl          # optional, derived (title/date/bench) for the demo
  index_dir: data/processed/index                  # M1
  statute_map: data/statute_map.csv                # M2
  treatment_gold: data/treatment_gold.csv          # M3
  queries: eval/queries.jsonl                      # M4, hand-written
  qrels: eval/qrels.tsv                            # M4, hand-judged
  gold_overrulings: eval/gold_overrulings.csv      # M4, hand-verified, used only for harmful@k
  results_dir: eval/results

# Stub switches. true  = use the fixed-value stub in stubs/fixed.py (the signal is NOT real).
#                false = call the real module. Flip a switch in the same commit that makes the real
#                function pass `python eval/smoke.py`. Override per run with LEXSHIFT_STUBS=none|all|search,health
stubs:
  search: false      # M1  m1_index.search (real: the compact index over data/processed/judgments.jsonl; `make unpack` then `make build-index`)
  statute: false     # M2  m2_statute.parse_query + continuity (real: needs data/processed/doc_statutes.jsonl, `make build-statutes`; CI builds it)
  health: false      # M3  m3_treatment.health (real: needs data/processed/doc_health.jsonl, `make m3` after the cached labels in data/llm_labels/)
  authority: false   # M3  m3_treatment.authority (real: PageRank over the resolved citations, same file)

m1_index:
  bm25: {k1: 1.2, b: 0.75}          # textbook defaults, M1 may tune

m2_statute:
  bns_commencement: "2024-07-01"    # offence on/after this date -> BNS/BNSS, before -> IPC/CrPC
  relation_weights:                 # Guide section 5, M2 block; M4 may tune on DEV
    equivalent: 1.0
    modified_punishment: 0.9
    modified_elements: 0.5
    split: 0.7                      # per part
    merged: 0.7                     # per part
    omitted: 0.1
    new: 0.0

m3_treatment:
  health_values:                    # Guide section 5, M3 block: strongest VALID negative treatment wins
    overruled: 0.1
    doubted: 0.6                    # doubted / criticised
    default: 1.0
  pagerank: {damping: 0.85, tol: 1.0e-10, max_iter: 200}   # textbook damping; power iteration to convergence
  # --- M3 pipeline settings (M3-owned files live here, not under the shared `paths:`) ---
  mentions: data/processed/m3_mentions.jsonl   # intermediate: every mention with window, resolution, appeal flag
  reports_dir: m3_treatment/reports            # resolution and classifier reports (committed)
  labelling_dir: data/labelling                # blank sheets and labelled rounds for the gold set
  window: {before: 1, after: 1, max_chars: 1500}
  resolver:                         # see m3_treatment/resolver.py
    name_threshold: 0.5
    name_threshold_no_year: 0.75
    ambiguity_margin: 0.1
    year_window: 1
    max_token_df: 0.02
    min_stop_df: 5
    range_name_agreement: 0.3
  llm:                              # offline only; never imported by health()/authority()
    model: gemini-3.5-flash-lite         # a STABLE Gemini id (never *-latest / *-preview: refused); the cache key includes it,
                                    # and each cache row records the model_version that answered. Gemini 3 ids want temperature 1.0
    temperature: 1.0               # Google recommends the default 1.0 for Gemini 3 models
    cache: data/llm_labels/m3_llm_labels.jsonl   # committed (D-033): rebuilding doc_health.jsonl needs no API key
    batch_size: 30                  # windows per request (the free tier allows 20 requests a day per model)
    min_interval_s: 1.0             # pacing between requests (free-tier rate limits)
    max_retries: 4
    scope: cued                     # cued = resolved mentions with a negative cue (overrul, doubt, ...) near the citation, the only ones that can lower a score; resolved = every mention linked to a corpus judgment; all
    few_shot_per_class: 2           # examples taken from the gold set's few-shot pool, excluded from evaluation
  labels: llm                       # label source for citations.jsonl: llm | baseline
  min_confidence: 0.5               # a negative label below this confidence does not lower health
  authority:
    edge_labels: [followed, neutral]   # Guide: PageRank over positive and neutral edges
    max_bench: 7                    # bench weight = log(1 + bench) / log(1 + max_bench), capped at 1
    unknown_bench: 2                # bench size assumed for the weight only when it is unknown (the commonest bench)
  max_evidence: 5                   # evidence items stored per judgment
  # --- Phase 2 (course classifiers and HITS); additive, nothing above changes ---
  silver: data/llm_labels/m3_silver.jsonl      # TRAINING data only: windows with a cached Gemini label (never a test standard)
  preds: data/processed/treatment_preds.jsonl  # window_id, classifier (nb | rocchio | knn | lr | llm), label, confidence
  classifiers:                      # m3_treatment/nb.py, vector_classifiers.py, compare.py
    folds: 5                        # stratified CV on the TRAINING data, for model selection only
    seed: 0
    nb_selection: [mi, chi2]        # feature-selection utilities tried (IIR 13.5)
    nb_k_grid: [50, 100, 300, 1000, 3000, 0]   # top-k terms tried; 0 = every term
    knn_k_grid: [1, 3, 5, 7]        # Guide: k chosen by cross-validation on training data only
    model_selection: m3_treatment/reports/model_selection.json   # the frozen choice that classify_*() use
  hits:                             # m3_treatment/hits.py
    root_n: 30                      # root set = the top-N search() results for the query
    max_in_per_root: 50             # Kleinberg's d: at most this many citing judgments added per root node (limits topic drift)
    iterations: 50                  # maximum power iterations
    tol: 1.0e-8                     # stop when the L1 change of both vectors is below this

ranking:                            # owner: M4
  candidates: 100                   # top-N taken from search() before re-ranking
  max_evidence: 3                   # evidence sentences kept per result
  use_tuned: true                   # overlay common/weights_tuned.yaml when it exists
  tuned_file: common/weights_tuned.yaml
  normalize:                        # per-signal normaliser: minmax (over the candidate set) | identity (clip to [0,1])
    rel: minmax                     # BM25 is unbounded and query dependent
    cont: identity                  # already a calibrated weight in [0, 1]; see DECISIONS.md D-006
    health: identity                # already calibrated (overruled 0.1, doubted 0.6, else 1.0)
    auth: minmax                    # PageRank mass is only meaningful relative to the candidates
  configs:                          # ablation systems; weights are renormalised to sum to 1 at load time
    b0:   {rel: 1.0}                                                  # BM25 only
    b1:   {rel: 0.7, cont: 0.3}                                       # + statutory continuity (placeholder)
    full: {rel: 0.5, cont: 0.2, health: 0.2, auth: 0.1}               # + health + authority (placeholder)
    # Phase 2 ablations (additive). Same starting weights as `full`; what differs is in `variants` below.
    full_hits:   {rel: 0.5, cont: 0.2, health: 0.2, auth: 0.1}        # auth = HITS authority on the query's base set
    full_tiered: {rel: 0.5, cont: 0.2, health: 0.2, auth: 0.1}        # candidates from the tiered index (inexact top-K)
  variants:                         # how a config deviates from the default pipeline (Phase 2). Absent = default.
    full_hits:   {auth_source: hits}          # pagerank (default) | hits  (m3_treatment.hits, query-dependent)
    full_tiered: {candidate_source: tiered}   # exact (default, M1 search()) | tiered | champion | elimination | cluster

evaluation:                         # owner: M4
  depth: 20                         # evaluate the top-20: the qrels pool is the union of the top-20 of every system
  judging_dir: eval/judging         # pooled sheets and the two judges' grades, one folder per round
  relevant_threshold: 1             # grade >= 1 counts as relevant for P@k, R@k and MAP
  gain: exp                         # nDCG gain: exp = 2**grade - 1, linear = grade
  seed: 0

clustering:                         # owner: M4 (m4_rank/cluster.py), Phase 2. Flat clustering for browsing, K-means written by us
  k: auto                           # auto = the elbow of the RSS curve over k_grid (no labels involved); or a fixed integer
  k_grid: [2, 4, 6, 8, 10, 12, 15, 20, 25, 30]
  seed: 0
  max_iter: 100
  n_init: 3                         # k-means++ restarts (seed, seed+1, ...); the run with the lowest RSS is kept
  vocab_size: 2000                  # top-M terms by df, after the df window below (laptop-sized dense vectors)
  min_df: 10
  max_df_ratio: 0.5                 # terms in more than half of the judgments carry little topical signal
  label_terms: 4                    # surface words shown per cluster label
  out: data/processed/clusters.jsonl
  meta: data/processed/clusters_meta.json
  report_dir: m4_rank/reports

inexact:                            # owner: M4 (m4_rank/inexact.py), Phase 2. Inexact top-K (IIR 7.1-7.2); never the default config
  artefact: data/processed/inexact.pkl.gz
  champion_r: 50                    # champion list length per term, by g(d) + BM25 tf saturation
  tier_cut: 0.8                     # tier 1 = authority g(d) at or above this quantile ...
  tier1_min_bench: 3                # ... or a bench of at least this many judges
  elim_max_df_ratio: 0.5            # index elimination: drop query terms in more than this share of judgments (low idf)
  elim_min_share: 0.5               # ... and keep judgments containing at least this share of the remaining terms
  leaders: 0                        # cluster pruning: 0 = round(sqrt(N)) leaders, chosen at random with `seed`
  seed: 0
  report_dir: m4_rank/reports
